<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>CyberShield Inspector</title>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
    }
    body {
      width: 320px;
      background: #0f172a;
      color: #f8fafc;
      padding: 16px;
    }
    .header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      border-bottom: 1px solid #334155;
      padding-bottom: 10px;
      margin-bottom: 15px;
    }
    .brand {
      font-weight: 700;
      font-size: 16px;
      color: #38bdf8;
      letter-spacing: 0.5px;
    }
    .badge {
      background: #1e293b;
      color: #94a3b8;
      font-size: 10px;
      padding: 2px 8px;
      border-radius: 12px;
      border: 1px solid #334155;
    }
    .card {
      background: #1e293b;
      border-radius: 10px;
      padding: 14px;
      border: 1px solid #334155;
      text-align: center;
    }
    .url-text {
      font-size: 12px;
      color: #94a3b8;
      word-break: break-all;
      margin-bottom: 12px;
    }
    .status-box {
      padding: 10px;
      border-radius: 8px;
      font-weight: bold;
      font-size: 14px;
      margin-bottom: 10px;
    }
    .status-safe {
      background: rgba(34, 197, 94, 0.15);
      color: #4ade80;
      border: 1px solid #22c55e;
    }
    .status-danger {
      background: rgba(239, 68, 68, 0.15);
      color: #f87171;
      border: 1px solid #ef4444;
    }
    .status-loading {
      background: rgba(56, 189, 248, 0.15);
      color: #38bdf8;
      border: 1px solid #0284c7;
    }
    .score {
      font-size: 12px;
      color: #cbd5e1;
    }
    .footer {
      margin-top: 15px;
      text-align: center;
      font-size: 11px;
      color: #64748b;
    }
  </style>
</head>
<body>

  <div class="header">
    <span class="brand">🛡️ CYBERSHIELD</span>
    <span class="badge">v1.0 Live</span>
  </div>

  <div class="card">
    <div id="url" class="url-text">Checking URL...</div>
    <div id="status" class="status-box status-loading">SCANNING...</div>
    <div id="score" class="score">Risk Score: --%</div>
  </div>

  <div class="footer">
    Protected by CyberShield Threat Suite
  </div>

  <script src="popup.js"></script>
</body>
</html>
